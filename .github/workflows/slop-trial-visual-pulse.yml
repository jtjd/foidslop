name: Slop Trial visual pulse

on:
  push:
    branches: [slop-trial-visual-pulse]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slop-trial-visual-pulse
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final product fixes
        run: python3 scripts/_slop_trial_visual_pulse.py

      - name: Install visual tooling
        run: |
          npm install --no-save playwright@1.55.0 sharp@0.33.5
          npx playwright install --with-deps chromium

      - name: Generate share cards
        run: node scripts/_capture_trial_images.js

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture-products.js
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/slop-trials.json','utf8'));
          for (const item of data.items) {
            if (item.image) {
              const imagePath = `.deploy${item.image}`;
              if (!fs.existsSync(imagePath)) throw new Error(`missing deploy visual ${imagePath}`);
            }
            const socialPath = `.deploy${item.socialImage}`;
            if (!fs.existsSync(socialPath)) throw new Error(`missing social visual ${socialPath}`);
          }
          NODE

      - name: Browser review
        run: |
          mkdir -p artifacts/slop-trial-pulse
          python3 -m http.server 4173 --directory .deploy >/tmp/foidslop-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const viewport of [{name:'desktop',width:1440,height:1000},{name:'mid',width:1120,height:900},{name:'mobile',width:390,height:844}]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              await page.goto('http://127.0.0.1:4173/culture/is-it-foidslop/simone-rocha-adidas.html', { waitUntil: 'networkidle' });
              await page.locator('.slop-trial-feed').scrollIntoViewIfNeeded();
              await page.waitForTimeout(350);
              const state = await page.evaluate(({ width, name }) => {
                const image = document.querySelector('[data-trial-image]');
                const card = document.querySelector('.slop-trial-card');
                const categories = document.querySelector('.slop-trial-categories');
                const queue = document.querySelector('[data-trial-queue]');
                const queueItems = [...document.querySelectorAll('[data-trial-queue-item]')];
                const all = [...document.querySelectorAll('main *, .site-header > *')];
                const offenders = all.filter(el => {
                  const style = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && r.width > 0 && r.height > 0 && (r.left < -3 || r.right > width + 3);
                }).filter(el => !categories?.contains(el)).map(el => ({tag:el.tagName,cls:el.className,text:(el.textContent||'').trim().slice(0,50)})).slice(0,8);
                const queueVisuals = queueItems.filter(button => {
                  const img = button.querySelector('img');
                  const fallback = button.querySelector('.slop-feed-fallback');
                  const imgOk = img && !img.hidden && img.complete && img.naturalWidth > 200;
                  const fallbackOk = fallback && getComputedStyle(fallback).visibility !== 'hidden';
                  return imgOk || fallbackOk;
                }).length;
                return {
                  imageLoaded: image && !image.hidden && image.complete && image.naturalWidth > 300,
                  cardWidth: card.getBoundingClientRect().width,
                  cardHeight: card.getBoundingClientRect().height,
                  hasSelect: Boolean(document.querySelector('select[data-trial-filter]')),
                  categoryButtons: document.querySelectorAll('[data-trial-category]').length,
                  hasEmptyGamesFilter: Boolean(document.querySelector('[data-trial-category="games"]')),
                  queueItems: queueItems.length,
                  queueVisuals,
                  queueColumns: getComputedStyle(queue).gridTemplateColumns.split(' ').filter(Boolean).length,
                  disputedPresent: Boolean(document.querySelector('[data-trial-disputed]')),
                  progressText: document.querySelector('[data-trial-progress]')?.textContent || '',
                  heroText: document.querySelector('.slop-trial-hero')?.textContent || '',
                  offenders,
                  viewportName: name
                };
              }, viewport);
              assert.equal(state.hasSelect, false);
              assert.ok(state.imageLoaded, `${viewport.name}: good lead source image did not render`);
              assert.ok(state.categoryButtons >= 7, `${viewport.name}: active category navigation is too thin`);
              assert.equal(state.hasEmptyGamesFilter, false, `${viewport.name}: empty Games filter should not render for Current`);
              assert.ok(state.queueItems >= 6, `${viewport.name}: current board is too thin`);
              assert.equal(state.queueVisuals, state.queueItems, `${viewport.name}: current board contains blank visual cards`);
              assert.ok(state.disputedPresent);
              assert.match(state.progressText, /current items voted/);
              assert.doesNotMatch(state.heroText, /Vote on the current feed/i);
              assert.equal(state.offenders.length, 0, `${viewport.name} offscreen: ${JSON.stringify(state.offenders)}`);
              assert.ok(state.cardWidth <= viewport.width + 1);
              if (viewport.name !== 'mobile') assert.ok(state.cardHeight < 850, `${viewport.name}: lead card still has excessive dead space (${state.cardHeight}px)`);
              if (viewport.name === 'mobile') assert.equal(state.queueColumns, 2, 'mobile current board should be two columns');
              await page.screenshot({ path: `artifacts/slop-trial-pulse/${viewport.name}.png`, fullPage: true });
              await page.close();
            }

            for (const id of ['tired-girl-eyes','daisy-chain-fields','lizzie-borden-monster']) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              await page.goto(`http://127.0.0.1:4173/culture/is-it-foidslop/${id}.html`, { waitUntil: 'networkidle' });
              const imageLoaded = await page.locator('[data-trial-image]').evaluate(img => !img.hidden && img.complete && img.naturalWidth > 300);
              assert.ok(imageLoaded, `${id}: curated source visual did not render`);
              await page.screenshot({ path: `artifacts/slop-trial-pulse/${id}.png`, fullPage: false });
              await page.close();
            }

            const fallbackPage = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            await fallbackPage.goto('http://127.0.0.1:4173/culture/is-it-foidslop/bridgerton-season-4.html', { waitUntil: 'networkidle' });
            const fallbackState = await fallbackPage.evaluate(() => ({
              imageHidden: document.querySelector('[data-trial-image]')?.hidden,
              fallbackHidden: document.querySelector('[data-trial-image-fallback]')?.hidden,
              fallbackText: document.querySelector('[data-trial-image-fallback]')?.textContent || '',
              ogImage: document.querySelector('meta[property="og:image"]')?.content || '',
              canonical: document.querySelector('link[rel="canonical"]')?.href || ''
            }));
            assert.equal(fallbackState.imageHidden, true);
            assert.equal(fallbackState.fallbackHidden, false);
            assert.match(fallbackState.fallbackText, /Bridgerton Season 4/i);
            assert.match(fallbackState.ogImage, /culture\/trials\/social\/bridgerton-season-4\.png$/);
            assert.match(fallbackState.canonical, /culture\/is-it-foidslop\/bridgerton-season-4$/);
            await fallbackPage.screenshot({ path: 'artifacts/slop-trial-pulse/bridgerton-fallback.png', fullPage: false });
            await fallbackPage.close();

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slop-trial-visual-pulse-final-review
          path: |
            artifacts/slop-trial-pulse/
            culture/trials/social/simone-rocha-adidas.png
            culture/trials/social/bridgerton-season-4.png
            culture/trials/social/pride-and-prejudice-2005.png

      - name: Commit materialized redesign
        run: |
          rm -rf node_modules package-lock.json artifacts
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git rm -f scripts/_slop_trial_visual_pulse.py scripts/_capture_trial_images.js
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finish Slop Trial visual culture board [skip ci]"
            git push
          fi
