name: Navigation Audit
on:
  push:
    branches: [navigation-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit navigation
        run: node scripts/_navigation_audit.js
