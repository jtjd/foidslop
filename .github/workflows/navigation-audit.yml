name: Navigation Audit
on:
  push:
    branches: [navigation-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize generated navigation
        run: node scripts/sync-navigation.js
      - name: Validate navigation contract
        run: node scripts/sync-navigation.js --check
      - name: Run unit tests
        run: npm test
      - name: Validate SEO
        run: node scripts/seo-check.js
      - name: Validate deploy build
        run: node scripts/build-deploy.js
      - name: Commit synchronized HTML
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -u
          if ! git diff --staged --quiet; then
            git commit -m "Synchronize generated navigation [skip ci]"
            git push
          fi
