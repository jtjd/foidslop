name: Fix Mochi Editorial Override
on:
  push:
    branches: [fix-vocabulary-link-colors-current]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add missing published override
        run: node scripts/_fix_mochi_editorial_override.js
      - name: Commit repaired editorial data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/published-recipe-copy-overrides.json
          git commit -m "Add editorial coverage for Sep 7 recipe"
          git push
