name: Slop Trial image-only finalization

on:
  push:
    branches: [slop-trial-visual-pulse]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slop-trial-image-only
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce image-only publishing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Publisher: derive the public trial set strictly from approved local display images.
          p = Path('scripts/publish-culture-products.js')
          s = p.read_text()
          anchor = "const trials = read('data/slop-trials.json');\n"
          insert = anchor + "const publishedTrials = (trials.items || []).filter(item => item.image && item.imageAlt && fs.existsSync(path.join(ROOT, item.image.replace(/^\\/+/, ''))));\n"
          if 'const publishedTrials =' not in s:
              s = s.replace(anchor, insert)

          s = s.replace("const activeCurrent = trials.items.filter(candidate => candidate.kind === 'current' && (!candidate.activeFrom || candidate.activeFrom <= today) && (!candidate.activeUntil || candidate.activeUntil >= today));",
                        "const activeCurrent = publishedTrials.filter(candidate => candidate.kind === 'current' && (!candidate.activeFrom || candidate.activeFrom <= today) && (!candidate.activeUntil || candidate.activeUntil >= today));")
          s = s.replace("const currentCount = activeCurrent.length || trials.items.filter(candidate => candidate.kind === 'current').length;",
                        "const currentCount = activeCurrent.length || publishedTrials.filter(candidate => candidate.kind === 'current').length;")
          s = s.replace("  const classicCount = trials.items.filter(candidate => candidate.kind === 'evergreen').length;\n", "")
          s = s.replace('<div class="slop-trial-nav"><div class="slop-trial-modes" role="group" aria-label="Trial set"><button type="button" data-trial-mode="current" aria-pressed="true">Current</button><button type="button" data-trial-mode="classics" aria-pressed="false">Classics</button></div><nav class="slop-trial-categories"', '<div class="slop-trial-nav"><nav class="slop-trial-categories"')
          s = s.replace('<img data-trial-image src="" alt="" width="960" height="640" decoding="async"><div class="slop-trial-media-fallback" data-trial-image-fallback hidden><span data-trial-image-category></span><strong data-trial-image-name></strong></div>', '<img data-trial-image src="" alt="" width="960" height="640" decoding="async">')
          s = s.replace("${scriptData('slop-trial-data', trials.items)}", "${scriptData('slop-trial-data', publishedTrials)}")
          s = s.replace("const activeTrials = trials.items.filter(item => item.kind === 'current' && (!item.activeFrom || item.activeFrom <= today) && (!item.activeUntil || item.activeUntil >= today));",
                        "const activeTrials = publishedTrials.filter(item => item.kind === 'current' && (!item.activeFrom || item.activeFrom <= today) && (!item.activeUntil || item.activeUntil >= today));")
          s = s.replace("const trialPool = activeTrials.length ? activeTrials : trials.items.filter(item => item.kind === 'evergreen');",
                        "const trialPool = activeTrials.length ? activeTrials : publishedTrials.filter(item => item.kind === 'current');")
          s = s.replace("...trials.items.map(item => `culture/is-it-foidslop/${item.id}`)", "...publishedTrials.map(item => `culture/is-it-foidslop/${item.id}`)")
          s = s.replace("for (const item of trials.items) if (!fs.existsSync(path.join(ROOT, `culture/is-it-foidslop/${item.id}.html`))) throw new Error(`Missing generated Slop Trial share page: ${item.id}`);",
                        "for (const item of publishedTrials) if (!fs.existsSync(path.join(ROOT, `culture/is-it-foidslop/${item.id}.html`))) throw new Error(`Missing generated Slop Trial share page: ${item.id}`);")
          old_generate = "write('culture/is-it-foidslop.html', renderTrialPage());\nfor (const item of trials.items) write(`culture/is-it-foidslop/${item.id}.html`, renderTrialPage(item));"
          new_generate = "fs.rmSync(path.join(ROOT, 'culture', 'is-it-foidslop'), { recursive: true, force: true });\nwrite('culture/is-it-foidslop.html', renderTrialPage());\nfor (const item of publishedTrials) write(`culture/is-it-foidslop/${item.id}.html`, renderTrialPage(item));"
          s = s.replace(old_generate, new_generate)
          s = s.replace("console.log(`Culture products source is valid: ${trials.items.length} trials, ${Object.keys(usernames.categories).length} username departments, ${taxonomy.branches.length} taxonomy branches.`);",
                        "console.log(`Culture products source is valid: ${publishedTrials.length} image-backed published trials (${trials.items.length} source entries), ${Object.keys(usernames.categories).length} username departments, ${taxonomy.branches.length} taxonomy branches.`);")

          # Validation: image-backed public pool must stay substantive and every published item must have a real local image.
          needle = "  if ((trials.items || []).filter(item => item.kind === 'current').length < 8) errors.push('Slop Trials needs a substantive current-events pool');\n"
          replacement = needle + "  if (publishedTrials.length < 6) errors.push('Slop Trials needs at least six approved image-backed published items');\n  for (const item of publishedTrials) {\n    if (!item.image || !item.imageAlt) errors.push(`Published Slop Trial ${item.id}: display image is required`);\n    else if (!fs.existsSync(path.join(ROOT, item.image.replace(/^\\//, '')))) errors.push(`Published Slop Trial ${item.id}: missing display image ${item.image}`);\n  }\n"
          if 'at least six approved image-backed' not in s:
              s = s.replace(needle, replacement)
          p.write_text(s)

          # Runtime: no text fallback cards. Every browser-visible item has an approved image.
          p = Path('culture/slop-tools.js')
          s = p.read_text()
          for line in [
              "    const imageFallback = root.querySelector('[data-trial-image-fallback]');\n",
              "    const imageCategory = root.querySelector('[data-trial-image-category]');\n",
              "    const imageName = root.querySelector('[data-trial-image-name]');\n",
          ]:
              s = s.replace(line, '')
          s = re.sub(r"\n    function fallbackMarkup\(item\) \{[\s\S]*?\n    \}\n\n    function cardMarkup", "\n    function cardMarkup", s, count=1)
          s = re.sub(r"      const visual = item\.image[\s\S]*?      return `\$\{visual\}", "      const visual = `<span class=\"slop-feed-visual\"><img src=\"${item.image}\" alt=\"\" width=\"480\" height=\"320\" loading=\"lazy\" decoding=\"async\"></span>`;\n      return `${visual}", s, count=1)
          s = re.sub(r"\n    function wireQueueImageFallbacks\(\) \{[\s\S]*?\n    \}\n", "\n", s, count=1)
          s = s.replace("      wireQueueImageFallbacks();\n", "")
          s = re.sub(r"\n    function showFallback\(item\) \{[\s\S]*?\n    \}\n", "\n", s, count=1)
          old = "      if (item.image) {\n        image.hidden = false;\n        imageFallback.hidden = true;\n        image.alt = item.imageAlt || '';\n        image.onerror = () => showFallback(item);\n        image.src = item.image;\n      } else {\n        showFallback(item);\n      }"
          new = "      image.hidden = false;\n      image.alt = item.imageAlt;\n      image.removeAttribute('onerror');\n      image.src = item.image;"
          s = s.replace(old, new)
          p.write_text(s)

          # Weekly Slop: only rotate image-backed, active current trials and link to their real share pages.
          p = Path('scripts/weekly-community.js')
          s = p.read_text()
          old = "const slopTrial = slopTrials.items.length ? slopTrials.items[weekSeed % slopTrials.items.length] : null;"
          new = "const slopTrialPool = slopTrials.items.filter(item => item.kind === 'current' && item.image && fs.existsSync(path.join(ROOT, item.image.replace(/^\\//, ''))) && (!item.activeFrom || item.activeFrom <= dateString) && (!item.activeUntil || item.activeUntil >= dateString));\n  const slopTrial = slopTrialPool.length ? slopTrialPool[weekSeed % slopTrialPool.length] : null;"
          if old in s:
              s = s.replace(old, new)
          s = s.replace('https://foidslop.com/culture/is-it-foidslop?item=${encodeURIComponent(slopTrial.id)}', 'https://foidslop.com/culture/is-it-foidslop/${encodeURIComponent(slopTrial.id)}')
          p.write_text(s)

          # Regression tests now express the image-only product contract.
          p = Path('test/slop-trial-editorial.test.js')
          s = p.read_text()
          s = re.sub(r"test\('Slop Trial defaults to a sourced visual current-events pool',[\s\S]*?\n\}\);", r'''test('Slop Trial publishes only real image-backed current items', () => {
  const published = trials.items.filter(item => item.kind === 'current' && item.image);
  assert.ok(published.length >= 6);
  for (const item of published) {
    assert.match(item.sourceUrl, /^https:\/\//);
    assert.ok(item.whyNow.length >= 25);
    assert.match(item.activeFrom, /^2026-/);
    assert.match(item.activeUntil, /^2026-/);
    assert.match(item.image, /^\/culture\/trials\/[a-z0-9-]+\.webp$/);
    assert.ok(item.imageAlt.length >= 20);
    assert.ok(fs.existsSync(item.image.replace(/^\//, '')), `missing ${item.image}`);
  }
  const payloadMatch = page.match(/<script type="application\/json" id="slop-trial-data">([\s\S]*?)<\/script>/);
  assert.ok(payloadMatch);
  const payload = JSON.parse(payloadMatch[1]);
  assert.ok(payload.length >= 6);
  assert.ok(payload.every(item => item.image && item.imageAlt));
  assert.doesNotMatch(page, /data-trial-mode="classics"/);
  assert.doesNotMatch(page, /data-trial-image-fallback/);
});''', s, count=1)
          s = s.replace("assert.match(page, /Current fashion, media, food, games and internet stuff/);", "assert.match(page, /things from this week's feed/i);")
          p.write_text(s)

          p = Path('test/culture-products.test.js')
          s = p.read_text()
          s = s.replace("  for (const item of trials.items) {\n    const sharePath = `culture/is-it-foidslop/${item.id}.html`;",
                        "  for (const item of trials.items.filter(item => item.image)) {\n    const sharePath = `culture/is-it-foidslop/${item.id}.html`;")
          s = re.sub(r"\ntest\('current Slop Trial visuals fail closed instead of shipping bad screenshots',[\s\S]*?\n\}\);", r'''
test('Slop Trial public surface has no image-less cards or fallbacks', () => {
  const page = file('culture/is-it-foidslop.html');
  const payload = JSON.parse(page.match(/<script type="application\/json" id="slop-trial-data">([\s\S]*?)<\/script>/)[1]);
  assert.ok(payload.length >= 6);
  assert.ok(payload.every(item => item.image && item.imageAlt));
  assert.doesNotMatch(page, /data-trial-image-fallback/);
  assert.doesNotMatch(page, /data-trial-mode="classics"/);
  const runtime = file('culture/slop-tools.js');
  assert.doesNotMatch(runtime, /fallbackMarkup|showFallback|slop-feed-fallback/);
});''', s, count=1)
          p.write_text(s)
          PY

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture-products.js
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js

      - name: Browser audit every published trial
        run: |
          mkdir -p artifacts/slop-trial-image-only
          python3 -m http.server 4173 --directory .deploy >/tmp/foidslop-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/slop-trials.json','utf8'));
          const published = data.items.filter(item => item.image);
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const item of published) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              await page.goto(`http://127.0.0.1:4173/culture/is-it-foidslop/${item.id}.html`, { waitUntil: 'networkidle' });
              const state = await page.locator('[data-trial-image]').evaluate(img => ({ display:getComputedStyle(img).display, complete:img.complete, width:img.naturalWidth, src:img.getAttribute('src') }));
              assert.notEqual(state.display, 'none', `${item.id}: display image hidden`);
              assert.ok(state.complete && state.width > 300, `${item.id}: display image failed`);
              assert.equal(state.src, item.image);
              assert.equal(await page.locator('[data-trial-image-fallback]').count(), 0, `${item.id}: fallback UI leaked`);
              await page.close();
            }
            for (const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              await page.goto('http://127.0.0.1:4173/culture/is-it-foidslop.html', { waitUntil: 'networkidle' });
              await page.locator('.slop-trial-feed').scrollIntoViewIfNeeded();
              await page.waitForTimeout(250);
              const state = await page.evaluate(width => {
                const payload = JSON.parse(document.getElementById('slop-trial-data').textContent);
                const categories = document.querySelector('.slop-trial-categories');
                const offenders = [...document.querySelectorAll('main *, .site-header > *')].filter(el => {
                  const style = getComputedStyle(el), r = el.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && r.width > 0 && r.height > 0 && (r.left < -3 || r.right > width + 3);
                }).filter(el => !categories?.contains(el));
                return { payload, offenders:offenders.length, classics:document.querySelectorAll('[data-trial-mode="classics"]').length, fallbacks:document.querySelectorAll('[data-trial-image-fallback], .slop-feed-fallback').length };
              }, viewport.width);
              assert.ok(state.payload.length >= 6 && state.payload.every(item => item.image));
              assert.equal(state.classics, 0);
              assert.equal(state.fallbacks, 0);
              assert.equal(state.offenders, 0);
              await page.screenshot({ path:`artifacts/slop-trial-image-only/${viewport.name}.png`, fullPage:true });
              await page.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload review
        uses: actions/upload-artifact@v4
        with:
          name: slop-trial-image-only-review
          path: artifacts/slop-trial-image-only/

      - name: Commit image-only product
        run: |
          rm -rf node_modules package-lock.json artifacts
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Require real images for every published Slop Trial [skip ci]"
            git push
          fi
