name: Final culture visual integration validation

on:
  push:
    branches: [culture-visual-hotfix]
    paths:
      - '.github/workflows/culture-visual-hotfix-final.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: culture-visual-hotfix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize homepage integration
        run: node scripts/finalize-culture-visual-hotfix.js

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js

      - name: Browser visual smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 -d .deploy >/tmp/foidslop-http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/foidslop-final-screens
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });

            await page.goto('http://127.0.0.1:4173/what-is-foidslop.html', { waitUntil: 'networkidle' });
            const receipts = page.locator('.culture-receipt img');
            assert.ok(await receipts.count() >= 2, 'what-is-foidslop should render at least two receipts');
            for (let i = 0; i < await receipts.count(); i++) {
              const image = receipts.nth(i);
              await image.scrollIntoViewIfNeeded();
              await image.evaluate(async img => { if (img.decode) await img.decode().catch(() => {}); });
              const visible = await image.evaluate(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
              assert.ok(visible, `receipt image ${i + 1} did not visibly load`);
            }
            await page.locator('h1').scrollIntoViewIfNeeded();
            await page.screenshot({ path: '/tmp/foidslop-final-screens/what-is-foidslop.png', fullPage: true });

            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
            const cultureSection = page.locator('.zine-home .zine-culture');
            assert.equal(await cultureSection.count(), 1, 'homepage culture section should be inside .zine-home');
            const relation = await cultureSection.evaluate(el => {
              const repeat = document.querySelector('.zine-newsletter-repeat');
              return repeat ? !!(el.compareDocumentPosition(repeat) & Node.DOCUMENT_POSITION_FOLLOWING) : false;
            });
            assert.ok(relation, 'homepage culture section should appear before the closing newsletter');
            const cssHref = await page.locator('link[href*="css/culture.css"]').getAttribute('href');
            assert.equal(cssHref, 'css/culture.css?v=20260906-3', 'homepage culture CSS cache key is stale');
            const homeCardStyle = await page.locator('.zine-culture-grid>a').first().evaluate(el => {
              const s = getComputedStyle(el);
              return { background: s.backgroundColor, color: s.color };
            });
            assert.notEqual(homeCardStyle.background, 'rgb(255, 255, 255)', 'homepage culture card fell back to white');
            assert.notEqual(homeCardStyle.background, homeCardStyle.color, 'homepage culture card text has no contrast');
            await cultureSection.scrollIntoViewIfNeeded();
            await page.screenshot({ path: '/tmp/foidslop-final-screens/homepage.png', fullPage: true });

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: culture-visual-hotfix-final-screens
          path: /tmp/foidslop-final-screens/*.png
          if-no-files-found: error

      - name: Commit final hotfix
        run: |
          rm -f scripts/finalize-culture-visual-hotfix.js .github/workflows/culture-visual-hotfix-final.yml
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Finish culture homepage integration hotfix'
          git push origin HEAD:culture-visual-hotfix
