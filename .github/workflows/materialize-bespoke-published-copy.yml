name: Materialize bespoke published recipe copy

on:
  push:
    branches: [bespoke-published-recipe-copy]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[bespoke-materialize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bespoke-published-recipe-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authored source
        run: npm test
      - name: Apply bespoke copy and validate generated site
        run: |
          node scripts/apply-editorial-overrides.js
          node scripts/audit-editorial-quality.js
          node scripts/daily-publish.js
          node scripts/seo-check.js
          npm test
      - name: Commit materialized recipe pages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "[bespoke-materialize] Apply bespoke copy to all published recipes"
            git push origin HEAD:bespoke-published-recipe-copy
          else
            echo "No generated changes to materialize."
          fi
