name: Export published recipe audit

on:
  push:
    branches: [bespoke-published-recipe-copy]

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[audit-export]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bespoke-published-recipe-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export compact published recipe review sheet
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const db = JSON.parse(fs.readFileSync('data/foidslop-meals.json','utf8'));
          const rows = db.meals.filter(m => m.status === 'published').map(m => ({
            id:m.id,
            slug:m.slug,
            name:m.name,
            description:m.description,
            category:m.category,
            tags:m.tags,
            ingredients:m.ingredients.map(i => i.name),
            steps:m.steps.map(s => `${s.name}: ${s.text}`),
            notes:m.notes || '',
            headnote:m.headnote || '',
            substitutions:m.substitutions || '',
            storage:m.storage || ''
          }));
          fs.writeFileSync('data/published-copy-audit.ndjson', rows.map(r => JSON.stringify(r)).join('\n') + '\n');
          console.log(`Exported ${rows.length} published recipes.`);
          NODE
      - name: Commit audit sheet
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/published-copy-audit.ndjson
          if ! git diff --staged --quiet; then
            git commit -m "[audit-export] Export published recipe review sheet"
            git push origin HEAD:bespoke-published-recipe-copy
          fi
