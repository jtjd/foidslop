name: Materialize editorial remediation

on:
  push:
    branches: [seo-content-quality-remediation]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialize-remediation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: seo-content-quality-remediation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply remediation and regenerate site
        run: |
          node scripts/apply-editorial-overrides.js
          node scripts/audit-editorial-quality.js
          node scripts/daily-publish.js
          node scripts/seo-check.js

      - name: Commit generated remediation
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html slop/ recipes/ data/foidslop-meals.json _redirects sitemap.xml feed.xml pinterest-rss.xml \
            what-is-foidslop.html what-does-foid-mean.html girl-dinner-ideas.html editorial-standards.html \
            data/lastmod-state.json data/editorial-pages.json
          for page in $(node -p "JSON.parse(require('fs').readFileSync('data/editorial-pages.json','utf8')).map(p => p.slug + '.html').join(' ')"); do
            [ -f "$page" ] && git add "$page"
          done
          if ! git diff --staged --quiet; then
            git commit -m "[materialize-remediation] Apply editorial remediation to current pages"
            git push origin HEAD:seo-content-quality-remediation
          else
            echo "No generated remediation changes to commit."
          fi
