name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve checked-in publication date
        run: |
          VALIDATION_DATE=$(node -e "const db=require('./data/foidslop-meals.json'); const dates=(db.meals||db).filter(m=>m.status==='published' && m.publishDate).map(m=>m.publishDate).sort(); if(!dates.length) process.exit(1); process.stdout.write(dates.at(-1));")
          echo "VALIDATION_DATE=$VALIDATION_DATE" >> "$GITHUB_ENV"
          echo "Validating checked-in publication state through $VALIDATION_DATE"

      - name: Run unit tests
        run: npm test

      - name: Validate culture source
        run: |
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check

      - name: Apply editorial remediation in validation workspace
        run: node scripts/apply-editorial-overrides.js

      - name: Audit remediated editorial quality
        run: node scripts/audit-editorial-quality.js

      - name: Regenerate public site
        run: |
          node scripts/daily-publish.js --date "$VALIDATION_DATE"
          node scripts/publish-culture.js --date "$VALIDATION_DATE"
          node scripts/publish-culture-products.js --date "$VALIDATION_DATE"
          node scripts/sync-navigation.js

      - name: Validate canonical navigation
        run: node scripts/sync-navigation.js --check

      - name: Validate generated SEO output
        run: node scripts/seo-check.js

      - name: Validate deployable public build
        run: node scripts/build-deploy.js

      - name: Re-run tests after generation
        run: npm test
