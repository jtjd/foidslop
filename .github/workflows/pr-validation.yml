name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm test

      - name: Validate culture source
        run: |
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check

      - name: Apply editorial remediation in validation workspace
        run: node scripts/apply-editorial-overrides.js

      - name: Audit remediated editorial quality
        run: node scripts/audit-editorial-quality.js

      - name: Ensure image tools are available
        run: |
          command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          command -v avifenc && command -v avifdec || (sudo apt-get update && sudo apt-get install -y libavif-bin)

      - name: Optimize newly published images
        run: node scripts/optimize-images.js

      - name: Regenerate public site
        run: |
          node scripts/daily-publish.js
          node scripts/publish-culture.js
          node scripts/publish-culture-products.js

      - name: Validate generated SEO output
        run: node scripts/seo-check.js

      - name: Validate deployable public build
        run: node scripts/build-deploy.js

      - name: Re-run tests after generation
        run: npm test
