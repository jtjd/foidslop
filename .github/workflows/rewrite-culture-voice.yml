name: One-time culture voice rewrite

on:
  push:
    branches: [foidslop-culture-expansion]
    paths:
      - '.github/workflows/rewrite-culture-voice.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foidslop-culture-expansion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rewrite source voice
        run: node scripts/rewrite-culture-voice.js

      - name: Validate source and tests
        run: |
          node scripts/publish-culture.js --check
          npm test

      - name: Regenerate public site
        run: |
          node scripts/daily-publish.js
          node scripts/publish-culture.js

      - name: Validate generated site
        run: |
          node scripts/seo-check.js
          node scripts/build-deploy.js
          npm test

      - name: Commit rewrite and generated output
        run: |
          rm -f scripts/rewrite-culture-voice.js .github/workflows/rewrite-culture-voice.yml
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Rewrite culture voice around taxonomy and usage'
          git push origin HEAD:foidslop-culture-expansion
