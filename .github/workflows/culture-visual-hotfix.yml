name: Culture visual integration hotfix

on:
  push:
    branches: [culture-visual-hotfix]
    paths:
      - '.github/workflows/culture-visual-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: culture-visual-hotfix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply visual integration fix
        run: node scripts/apply-culture-visual-hotfix.js

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js

      - name: Browser smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 -d .deploy >/tmp/foidslop-http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/foidslop-screens
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });

            await page.goto('http://127.0.0.1:4173/what-is-foidslop.html', { waitUntil: 'networkidle' });
            const receipts = page.locator('.culture-receipt img');
            assert.ok(await receipts.count() >= 2, 'what-is-foidslop should render at least two receipts');
            for (let i = 0; i < await receipts.count(); i++) {
              const loaded = await receipts.nth(i).evaluate(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
              assert.ok(loaded, `receipt image ${i + 1} did not load`);
            }
            const articleBox = await page.locator('.culture-article').boundingBox();
            assert.ok(articleBox && articleBox.width > 1300, `culture article is too narrow: ${articleBox?.width}`);
            const card = page.locator('.culture-card').first();
            const cardStyle = await card.evaluate(el => {
              const s = getComputedStyle(el);
              return { background: s.backgroundColor, color: s.color };
            });
            assert.notEqual(cardStyle.background, 'rgb(255, 255, 255)', 'dark-mode related card fell back to white');
            assert.notEqual(cardStyle.background, cardStyle.color, 'related card text has no contrast');
            await page.screenshot({ path: '/tmp/foidslop-screens/what-is-foidslop.png', fullPage: true });

            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
            const cultureSection = page.locator('.zine-culture');
            assert.equal(await cultureSection.count(), 1, 'homepage culture section missing');
            const sectionBox = await cultureSection.boundingBox();
            assert.ok(sectionBox && sectionBox.width > 1300, `homepage culture section is too narrow: ${sectionBox?.width}`);
            const homeCardStyle = await page.locator('.zine-culture-grid>a').first().evaluate(el => {
              const s = getComputedStyle(el);
              return { background: s.backgroundColor, color: s.color };
            });
            assert.notEqual(homeCardStyle.background, 'rgb(255, 255, 255)', 'homepage culture card fell back to white');
            assert.notEqual(homeCardStyle.background, homeCardStyle.color, 'homepage culture card text has no contrast');
            await page.screenshot({ path: '/tmp/foidslop-screens/homepage.png', fullPage: true });

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: culture-visual-hotfix-screens
          path: /tmp/foidslop-screens/*.png
          if-no-files-found: error

      - name: Commit hotfix
        run: |
          rm -f scripts/apply-culture-visual-hotfix.js .github/workflows/culture-visual-hotfix.yml
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Fix culture layout and surface visual receipts'
          git push origin HEAD:culture-visual-hotfix
