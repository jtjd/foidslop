name: Apply remediation source patch

on:
  push:
    branches: [seo-content-quality-remediation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[publisher-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: seo-content-quality-remediation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch publisher source
        run: node scripts/patch-publisher-source.js

      - name: Commit publisher patch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add scripts/daily-publish.js
          if ! git diff --staged --quiet; then
            git commit -m "[publisher-patch] Allow optional discovery copy and clarify recipe yield"
            git push origin HEAD:seo-content-quality-remediation
          else
            echo "Publisher source already patched."
          fi
