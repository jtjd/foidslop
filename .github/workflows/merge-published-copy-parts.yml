name: Consolidate bespoke published recipe copy

on:
  push:
    branches: [bespoke-published-recipe-copy]

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[merge-published-copy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bespoke-published-recipe-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consolidate and validate all published copy
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'data/published-copy-parts';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort();
          const entries = {};
          for (const file of files) {
            const part = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            for (const [slug, value] of Object.entries(part.entries || {})) {
              if (entries[slug]) throw new Error(`Duplicate bespoke copy entry: ${slug}`);
              entries[slug] = value;
            }
          }
          const db = JSON.parse(fs.readFileSync('data/foidslop-meals.json', 'utf8'));
          const published = db.meals.filter(m => m.status === 'published');
          const publishedSlugs = new Set(published.map(m => m.slug));
          if (Object.keys(entries).length !== published.length) {
            throw new Error(`Expected ${published.length} bespoke entries, got ${Object.keys(entries).length}`);
          }
          for (const meal of published) {
            const copy = entries[meal.slug];
            if (!copy) throw new Error(`Missing bespoke copy for ${meal.slug}`);
            if (!copy.headnote || copy.headnote.length < 60) throw new Error(`Missing/thin headnote for ${meal.slug}`);
            if (!(copy.substitutions || copy.storage)) throw new Error(`No useful supplemental copy for ${meal.slug}`);
            for (const [field, text] of Object.entries(copy)) {
              if (typeof text !== 'string' || text.trim().length < 60) throw new Error(`Thin ${field} for ${meal.slug}`);
              if (text.includes('—')) throw new Error(`Em dash in ${field} for ${meal.slug}`);
              if (/Protein here is a suggestion|Swap .* freely and let the sauce and timing lead/i.test(text)) throw new Error(`Legacy boilerplate in ${field} for ${meal.slug}`);
            }
          }
          for (const slug of Object.keys(entries)) {
            if (!publishedSlugs.has(slug)) throw new Error(`Bespoke entry is not currently published: ${slug}`);
          }
          fs.writeFileSync('data/published-recipe-copy-overrides.json', JSON.stringify({revisionDate:'2026-09-06', entries}, null, 2) + '\n');
          console.log(`Validated bespoke copy for ${published.length}/${published.length} published recipes.`);
          NODE
      - name: Commit consolidated copy
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/published-recipe-copy-overrides.json
          if ! git diff --staged --quiet; then
            git commit -m "[merge-published-copy] Consolidate bespoke copy for all published recipes"
            git push origin HEAD:bespoke-published-recipe-copy
          fi
