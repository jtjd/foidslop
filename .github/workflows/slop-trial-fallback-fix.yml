name: Slop Trial image-only review

on:
  push:
    branches: [slop-trial-visual-pulse]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slop-trial-image-only-review
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply image-only product contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_image_only_trials.py')
          s = p.read_text()
          shim = """\n_real_re_sub = re.sub\ndef _literal_sub(pattern, repl, string, count=0, flags=0):\n    if isinstance(repl, str):\n        return _real_re_sub(pattern, lambda _match: repl, string, count=count, flags=flags)\n    return _real_re_sub(pattern, repl, string, count=count, flags=flags)\nre.sub = _literal_sub\n"""
          if '_literal_sub' not in s:
              s = s.replace('import re\n', 'import re\n' + shim)
          p.write_text(s)
          PY
          python3 scripts/_apply_image_only_trials.py

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture-products.js
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js

      - name: Browser audit every published trial
        run: |
          mkdir -p artifacts/slop-trial-image-only
          python3 -m http.server 4173 --directory .deploy >/tmp/foidslop-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/slop-trials.json', 'utf8'));
          const published = data.items.filter(item => item.image);

          (async () => {
            assert.ok(published.length >= 6, 'image-backed board is too small');
            const browser = await chromium.launch({ headless: true });

            for (const item of published) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              await page.goto(`http://127.0.0.1:4173/culture/is-it-foidslop/${item.id}.html`, { waitUntil: 'networkidle' });
              const state = await page.locator('[data-trial-image]').evaluate(img => ({
                display: getComputedStyle(img).display,
                complete: img.complete,
                width: img.naturalWidth,
                src: img.getAttribute('src')
              }));
              assert.notEqual(state.display, 'none', `${item.id}: image hidden`);
              assert.ok(state.complete && state.width > 300, `${item.id}: image failed`);
              assert.equal(state.src, item.image);
              assert.equal(await page.locator('[data-trial-image-fallback]').count(), 0, `${item.id}: fallback UI leaked`);
              await page.close();
            }

            for (const viewport of [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 }
            ]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              await page.goto('http://127.0.0.1:4173/culture/is-it-foidslop.html', { waitUntil: 'networkidle' });
              await page.locator('.slop-trial-feed').scrollIntoViewIfNeeded();
              await page.waitForTimeout(300);
              const state = await page.evaluate(width => {
                const payload = JSON.parse(document.getElementById('slop-trial-data').textContent);
                const categories = document.querySelector('.slop-trial-categories');
                const offenders = [...document.querySelectorAll('main *, .site-header > *')].filter(el => {
                  const style = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && r.width > 0 && r.height > 0 && (r.left < -3 || r.right > width + 3);
                }).filter(el => !categories?.contains(el));
                return {
                  payload,
                  offenders: offenders.length,
                  classics: document.querySelectorAll('[data-trial-mode="classics"]').length,
                  fallbacks: document.querySelectorAll('[data-trial-image-fallback], .slop-feed-fallback').length
                };
              }, viewport.width);
              assert.ok(state.payload.length >= 6);
              assert.ok(state.payload.every(item => item.image && item.imageAlt));
              assert.equal(state.classics, 0);
              assert.equal(state.fallbacks, 0);
              assert.equal(state.offenders, 0);
              await page.screenshot({ path: `artifacts/slop-trial-image-only/${viewport.name}.png`, fullPage: true });
              await page.close();
            }

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload review
        uses: actions/upload-artifact@v4
        with:
          name: slop-trial-image-only-review
          path: artifacts/slop-trial-image-only/

      - name: Commit image-only product
        run: |
          rm -rf node_modules package-lock.json artifacts
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Require real images for every published Slop Trial [skip ci]"
            git push
          fi
