name: Slop Trial fallback fix

on:
  push:
    branches: [slop-trial-visual-pulse]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slop-trial-fallback-fix
  cancel-in-progress: true

jobs:
  fix-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finish visual polish and bump CSS version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/culture-showcase.css')
          text = css.read_text()
          hidden_rule = '\n/* Slop Trial fallbacks must fully replace rejected source images. */\n.slop-trial-media>img[hidden]{display:none!important}\n'
          if '.slop-trial-media>img[hidden]' not in text:
              text += hidden_rule
          consent_rule = '''
/* Keep first-visit consent from covering the interactive culture tools. */
.slop-trial-page~.cookie-consent,.cookie-consent:has(~script #never){max-width:480px}
body:has(.slop-trial-page) .cookie-consent{left:auto;right:14px;bottom:14px;max-width:460px;margin:0}
body:has(.slop-trial-page) .cookie-consent-inner{gap:12px;padding:12px 14px}
body:has(.slop-trial-page) .cookie-consent-text{font-size:.68rem;line-height:1.45}
body:has(.slop-trial-page) .cookie-consent-btn{padding:7px 10px;font-size:.58rem}
@media(max-width:600px){
  body:has(.slop-trial-page) .cookie-consent{left:8px;right:8px;bottom:8px;max-width:none}
  body:has(.slop-trial-page) .cookie-consent-inner{gap:9px;padding:10px}
  body:has(.slop-trial-page) .cookie-consent-text{font-size:.64rem;line-height:1.35}
  body:has(.slop-trial-page) .cookie-consent-actions{gap:6px}
  body:has(.slop-trial-page) .cookie-consent-btn{padding:7px 8px}
}
'''
          if 'Keep first-visit consent from covering the interactive culture tools' not in text:
              text += consent_rule
          css.write_text(text)

          publisher = Path('scripts/publish-culture-products.js')
          p = publisher.read_text()
          p = p.replace('culture-showcase.css?v=20260907-1', 'culture-showcase.css?v=20260907-3')
          p = p.replace('culture-showcase.css?v=20260907-2', 'culture-showcase.css?v=20260907-3')
          publisher.write_text(p)
          PY

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture-products.js
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js

      - name: Browser review
        run: |
          mkdir -p artifacts/slop-trial-final
          python3 -m http.server 4173 --directory .deploy >/tmp/foidslop-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });

            const fallback = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            await fallback.goto('http://127.0.0.1:4173/culture/is-it-foidslop/bridgerton-season-4.html', { waitUntil: 'networkidle' });
            const fallbackState = await fallback.evaluate(() => {
              const image = document.querySelector('[data-trial-image]');
              const backup = document.querySelector('[data-trial-image-fallback]');
              const media = document.querySelector('.slop-trial-media');
              const consent = document.querySelector('.cookie-consent');
              return {
                imageDisplay: getComputedStyle(image).display,
                fallbackDisplay: getComputedStyle(backup).display,
                fallbackText: backup.textContent || '',
                mediaHeight: media.getBoundingClientRect().height,
                consentWidth: consent?.getBoundingClientRect().width || 0,
                cssHref: document.querySelector('link[href*="culture-showcase.css"]')?.getAttribute('href') || ''
              };
            });
            assert.equal(fallbackState.imageDisplay, 'none');
            assert.notEqual(fallbackState.fallbackDisplay, 'none');
            assert.match(fallbackState.fallbackText, /Bridgerton Season 4/i);
            assert.ok(fallbackState.mediaHeight < 600, `fallback media is still oversized: ${fallbackState.mediaHeight}px`);
            assert.ok(fallbackState.consentWidth <= 470, `desktop consent banner too wide: ${fallbackState.consentWidth}px`);
            assert.match(fallbackState.cssHref, /20260907-3/);
            await fallback.screenshot({ path: 'artifacts/slop-trial-final/bridgerton-fallback.png', fullPage: false });
            await fallback.close();

            for (const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              await page.goto('http://127.0.0.1:4173/culture/is-it-foidslop/simone-rocha-adidas.html', { waitUntil: 'networkidle' });
              await page.locator('.slop-trial-feed').scrollIntoViewIfNeeded();
              await page.waitForTimeout(300);
              const state = await page.evaluate(width => {
                const categories = document.querySelector('.slop-trial-categories');
                const all = [...document.querySelectorAll('main *, .site-header > *')];
                const offenders = all.filter(el => {
                  const style = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && r.width > 0 && r.height > 0 && (r.left < -3 || r.right > width + 3);
                }).filter(el => !categories?.contains(el));
                const queue = document.querySelector('[data-trial-queue]');
                const consent = document.querySelector('.cookie-consent');
                return {
                  offenders: offenders.length,
                  cardHeight: document.querySelector('.slop-trial-card').getBoundingClientRect().height,
                  columns: getComputedStyle(queue).gridTemplateColumns.split(' ').filter(Boolean).length,
                  hasGames: Boolean(document.querySelector('[data-trial-category="games"]')),
                  consentHeight: consent?.getBoundingClientRect().height || 0
                };
              }, viewport.width);
              assert.equal(state.offenders, 0);
              assert.equal(state.hasGames, false);
              if (viewport.name === 'desktop') assert.ok(state.cardHeight < 850);
              if (viewport.name === 'mobile') {
                assert.equal(state.columns, 2);
                assert.ok(state.consentHeight < 125, `mobile consent banner too tall: ${state.consentHeight}px`);
              }
              await page.screenshot({ path: `artifacts/slop-trial-final/${viewport.name}.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload final review
        uses: actions/upload-artifact@v4
        with:
          name: slop-trial-final-review
          path: artifacts/slop-trial-final/

      - name: Commit fix
        run: |
          rm -rf node_modules package-lock.json artifacts
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Polish Slop Trial consent and fallbacks [skip ci]"
            git push
          fi
