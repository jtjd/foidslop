name: One-time culture expansion materialization

on:
  push:
    branches: [foidslop-culture-expansion]
    paths: [.github/workflows/materialize-culture-expansion.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate full public site
        run: |
          node scripts/apply-editorial-overrides.js
          node scripts/daily-publish.js --date 2026-09-06
          node scripts/publish-culture.js --date 2026-09-06
      - name: Validate generated site
        run: |
          npm test
          node scripts/publish-culture.js --check
          node scripts/audit-editorial-quality.js
          node scripts/seo-check.js
          node scripts/build-deploy.js
          npm test
      - name: Remove one-time workflow and commit output
        run: |
          rm .github/workflows/materialize-culture-expansion.yml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git reset -- .deploy 2>/dev/null || true
          git commit -m "Materialize culture expansion across public site"
          git push
