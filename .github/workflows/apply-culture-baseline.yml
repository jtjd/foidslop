name: One-time culture baseline rewrite

on:
  push:
    branches: [foidslop-culture-expansion]
    paths:
      - '.github/workflows/apply-culture-baseline.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foidslop-culture-expansion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rewrite culture source
        run: |
          node scripts/rewrite-culture-baseline.js
          node - <<'NODE'
          const fs = require('fs');
          const dictionaryFile = 'data/dictionary.json';
          const data = JSON.parse(fs.readFileSync(dictionaryFile, 'utf8'));
          const femcel = data.entries.find(entry => entry.slug === 'femcel');
          femcel.description = 'Femcel means female involuntary celibate. Online it also describes lonely-girl memes, aesthetics, characters, playlists, and posting styles.';
          const foid = data.entries.find(entry => entry.slug === 'foid');
          foid.definition = 'Foid meaning in slang: foid means woman in 4chan/incel slang. It is short for femoid, and it is the root word in foidslop.';
          fs.writeFileSync(dictionaryFile, JSON.stringify(data, null, 2) + '\n');
          const testFile = 'test/culture-content.test.js';
          let test = fs.readFileSync(testFile, 'utf8');
          test = test.replace(/\\n/g, '\n');
          fs.writeFileSync(testFile, test);
          NODE

      - name: Validate source
        run: |
          node scripts/publish-culture.js --check
          npm test

      - name: Regenerate public site
        run: |
          node scripts/daily-publish.js
          node scripts/publish-culture.js

      - name: Validate generated site
        run: |
          node scripts/seo-check.js
          node scripts/build-deploy.js
          npm test

      - name: Commit baseline rewrite
        run: |
          rm -f scripts/rewrite-culture-baseline.js .github/workflows/apply-culture-baseline.yml
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Set concrete editorial baseline for culture'
          git push origin HEAD:foidslop-culture-expansion
