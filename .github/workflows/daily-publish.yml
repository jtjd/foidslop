name: Daily Slop Publish

on:
  schedule:
    # 12:05 AM EST / 1:05 AM EDT; publisher resolves the America/New_York date.
    - cron: '5 5 * * *'
  workflow_dispatch:

permissions:
  contents: write # REQUIRED for the bot to push commits

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: '22' # Updated to Node 22 LTS

      - name: Ensure image tools are available
        run: |
          command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          command -v avifenc && command -v avifdec || (sudo apt-get update && sudo apt-get install -y libavif-bin)

      - name: Optimize newly published images
        run: node scripts/optimize-images.js

      - name: Run daily publish script
        run: node scripts/daily-publish.js

      - name: Validate generated SEO output
        run: node scripts/seo-check.js

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html slop/ recipes/ data/foidslop-meals.json _redirects sitemap.xml feed.xml pinterest-rss.xml \
            what-is-foidslop.html what-does-foid-mean.html girl-dinner-ideas.html editorial-standards.html \
            assets/shop/DJTNIP-hq.avif assets/shop/DJTNIP-hq.webp assets/shop/CarModel-hq.avif \
            assets/shop/CarModel-hq.webp assets/shop/MerchModel-hq.avif assets/shop/MerchModel-hq.webp \
            assets/brand/logo.webp
          if ! git diff --staged --quiet; then
            git commit -m "Daily Slop Update: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
