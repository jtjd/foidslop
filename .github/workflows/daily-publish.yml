name: Daily Slop Publish

on:
  schedule:
    # 12:05 AM EST / 1:05 AM EDT; publisher resolves the America/New_York date.
    - cron: '5 5 * * *'
  workflow_dispatch:

permissions:
  contents: write # REQUIRED for the bot to push commits

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: '22' # Updated to Node 22 LTS

      - name: Ensure ImageMagick is available
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Optimize newly published images
        run: node optimize-images.js

      - name: Run daily publish script
        run: node daily-publish.js

      - name: Validate generated SEO output
        run: node seo-check.js

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html slop/ recipes/ foidslop-meals.json og-image.png _redirects sitemap.xml feed.xml \
            what-is-foidslop.html girl-dinner-ideas.html editorial-standards.html
          if ! git diff --staged --quiet; then
            git commit -m "Daily Slop Update: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
