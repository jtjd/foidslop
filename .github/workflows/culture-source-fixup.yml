name: One-time culture source fixup

on:
  push:
    branches: [foidslop-culture-expansion]
    paths: [.github/workflows/culture-source-fixup.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const scriptFile = 'scripts/publish-culture.js';
          let script = fs.readFileSync(scriptFile, 'utf8');
          script = script.replace(
            "function prefixFor(route) {\n  const depth = route.split('/').filter(Boolean).length;\n  return depth > 1 ? '../'.repeat(depth - 1) : '';\n}",
            "function prefixFor(route) {\n  if (route === 'culture' || route === 'dictionary') return '../';\n  const depth = route.split('/').filter(Boolean).length;\n  return depth > 1 ? '../'.repeat(depth - 1) : '';\n}"
          );
          script = script.replace("title: 'The Slop Dictionary | foidslop'", "title: 'The Slop Dictionary: Internet Slang Explained'");
          script = script.replace("title: 'Culture | foidslop'", "title: 'Culture: Field Notes From the Poisoned Internet'");
          script = script.replace("title: `${slopIndex.title} | foidslop`", "title: slopIndex.title");
          fs.writeFileSync(scriptFile, script);

          const dictionaryFile = 'data/dictionary.json';
          const dictionary = JSON.parse(fs.readFileSync(dictionaryFile, 'utf8'));
          const foid = dictionary.entries.find(entry => entry.slug === 'foid');
          foid.seoTitle = 'Foid Meaning in Slang: Definition, Origin & Is It a Slur?';
          foid.definition = 'Foid meaning in slang: foid is a derogatory internet term for a woman. It is shortened from femoid, a word associated with incel communities and built to make women sound less human.';
          fs.writeFileSync(dictionaryFile, JSON.stringify(dictionary, null, 2) + '\n');
          NODE
          rm .github/workflows/culture-source-fixup.yml
      - name: Validate targeted fixes
        run: |
          node scripts/publish-culture.js --check
          npm test
      - name: Commit fixes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add scripts/publish-culture.js data/dictionary.json .github/workflows/culture-source-fixup.yml
          git commit -m "Fix culture index paths and preserve foid search intent"
          git push
