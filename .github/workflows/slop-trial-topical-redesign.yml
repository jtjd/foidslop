name: Slop Trial topical redesign

on:
  push:
    branches: [slop-trial-topical-redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slop-trial-topical-redesign
  cancel-in-progress: false

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply redesign
        run: python3 scripts/_slop_trial_topical_redesign.py

      - name: Regenerate and validate
        run: |
          node scripts/publish-culture.js
          node scripts/publish-culture-products.js
          node scripts/publish-culture.js --check
          node scripts/publish-culture-products.js --check
          npm test
          node scripts/seo-check.js
          node scripts/build-deploy.js

      - name: Browser review
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p artifacts/slop-trial
          python3 -m http.server 4173 --directory .deploy >/tmp/foidslop-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            for (const viewport of [{name:'desktop',width:1440,height:1000},{name:'mid',width:1120,height:900},{name:'mobile',width:390,height:844}]) {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              await page.goto('http://127.0.0.1:4173/culture/is-it-foidslop.html', { waitUntil: 'networkidle' });
              const state = await page.evaluate(({width}) => {
                const h2 = document.querySelector('[data-trial-name]');
                const card = document.querySelector('.slop-trial-card');
                const source = document.querySelector('[data-trial-source]');
                const mode = document.querySelector('[data-trial-mode="current"]');
                const all = [...document.querySelectorAll('main *, .site-header > *')];
                const offenders = all.filter(el => {
                  const style = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && r.width > 0 && r.height > 0 && (r.left < -2 || r.right > width + 2);
                }).map(el => ({tag:el.tagName,cls:el.className,text:(el.textContent||'').trim().slice(0,60)})).slice(0,5);
                return {
                  docWidth: document.documentElement.scrollWidth,
                  h2Font: parseFloat(getComputedStyle(h2).fontSize),
                  h2Width: h2.getBoundingClientRect().width,
                  cardWidth: card.getBoundingClientRect().width,
                  sourceText: source.textContent,
                  sourceHidden: source.hidden,
                  currentPressed: mode.getAttribute('aria-pressed'),
                  offenders
                };
              }, viewport);
              assert.equal(state.offenders.length, 0, `${viewport.name} has offscreen content: ${JSON.stringify(state.offenders)}`);
              assert.equal(state.currentPressed, 'true');
              assert.equal(state.sourceHidden, false);
              assert.ok(state.sourceText.length > 3);
              assert.ok(state.h2Font <= (viewport.width <= 390 ? 58 : 78), `${viewport.name} trial title is still oversized: ${state.h2Font}`);
              assert.ok(state.cardWidth <= viewport.width + 1);
              await page.screenshot({ path: `artifacts/slop-trial/${viewport.name}.png`, fullPage: true });
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: slop-trial-topical-redesign-screens
          path: artifacts/slop-trial/

      - name: Commit generated redesign
        run: |
          rm -rf node_modules package-lock.json artifacts
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git rm -f scripts/_slop_trial_topical_redesign.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Redesign Slop Trial around current culture [skip ci]"
            git push
          fi
