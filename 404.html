<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>404 — Slop Not Found | foidslop</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/theme.css">
<script src="theme.js"></script>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; text-align: center; }
  .error-header { width:100%; max-width:1440px; margin:0 auto; min-height:76px; display:grid; grid-template-columns:180px 1fr 180px; align-items:center; padding:0 26px; border-bottom:1px solid var(--border); border-inline:1px solid var(--border); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .error-header img { width:126px; }
  .error-header-center { text-align:center; color:var(--text); }
  .error-header-right { display:flex; align-items:center; justify-content:flex-end; gap:16px; text-align:right; }
  .error-header-right a { color:inherit; text-decoration:none; white-space:nowrap; }
  .error-main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .error-code { font-family: 'Bebas Neue', sans-serif; font-size: clamp(6rem, 20vw, 12rem); line-height: 0.8; color: var(--text); }
  .error-msg { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin: 20px 0 40px; }
  .error-btn { display: inline-flex; align-items: center; gap: 10px; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bg); background: var(--text); text-decoration: none; padding: 12px 24px; }
  .error-main .theme-toggle { margin-top:24px; }
  @media (max-width: 700px) { .error-header { min-height:62px; grid-template-columns:1fr auto; padding:0 16px; } .error-header img { width:98px; } .error-header-center { display:none; } .error-header-right { text-align:right; } }
</style>
</head>
<body>
  <header class="error-header"><a href="/"><img src="logo.png" alt="FOID SLOP"></a><span class="error-header-center">Daily recipes / occasional objects / Issue 074</span><span class="error-header-right"><button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="true"><span class="theme-toggle-mark" aria-hidden="true">☼</span><span class="theme-toggle-label">Light mode</span></button><a href="slop/archive">Archive ↗</a><a href="https://shop.foidslop.com/">Shop ↗</a></span></header>
  <main class="error-main"><div>
    <div class="error-code">404</div>
    <p class="error-msg">This slop has gone bad.</p>
    <a href="/" class="error-btn">Back to Home →</a>
  </div></main>
</body>
</html>
